{% extends "base.html" %}
{% block title %}Thank you - Waypoint{% endblock %}
{% block content %}
  <h1>Thank you, {{ reporter }}.</h1>
  <p class="muted">
    {% if trail %}Your report on {{ trail }} is logged.{% else %}Your report is logged.{% endif %}
    We read every one.
  </p>
  <p>
    <a class="btn" href="{% url 'catalog' %}">Back to the catalog</a>
    <a class="btn btn--ghost" href="{% url 'report' %}">Report another</a>
  </p>
{% endblock %}
